[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-ppt-workflow-backend"
version = "0.1.0"
description = "科研竞赛 PPT 修改工作流的 FastAPI 骨架"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "python-pptx==1.0.2",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "B008", "I001", "UP031"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
